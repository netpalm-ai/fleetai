name: start-cloudflared
on: workflow_dispatch
jobs:
  start:
    runs-on: [self-hosted, Linux, i9]
    steps:
      - name: Start cloudflared via host systemd
        run: |
          docker run --rm --privileged --pid=host --network=host postgres:16-alpine \
            sh -c "apk add --no-cache util-linux >/dev/null && nsenter -t 1 -m -u -i -n systemctl reset-failed cloudflared || true && nsenter -t 1 -m -u -i -n systemctl start cloudflared && nsenter -t 1 -m -u -i -n systemctl is-active cloudflared"
