name: fleetai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleetai
      POSTGRES_DB: fleetai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetai -d fleetai"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    image: fleetai-backend:0.1.0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLEETAI_PRODUCT_ROOT: /product
      FLEETAI_PROJECTS: /projects
      DATABASE_URL: postgresql://fleetai:${POSTGRES_PASSWORD}@postgres:5432/fleetai
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_IDLE_MIN_LIMIT: ${SESSION_IDLE_MIN_LIMIT:-60}
      PRODUCT_PUBLIC_BASE_URL: ${PRODUCT_PUBLIC_BASE_URL:-}
      SMTP_EMAIL_USER: ${SMTP_EMAIL_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      NO_REPLY_EMAIL_ALIAS: ${NO_REPLY_EMAIL_ALIAS:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      AWS_REGION: ${AWS_REGION}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      FLEETAI_BEDROCK_CONNECT_TIMEOUT: ${FLEETAI_BEDROCK_CONNECT_TIMEOUT}
      FLEETAI_BEDROCK_MAX_TOKENS: ${FLEETAI_BEDROCK_MAX_TOKENS}
      FLEETAI_BEDROCK_TIMEOUT: ${FLEETAI_BEDROCK_TIMEOUT}
      FLEETAI_CURSOR_FAST: ${FLEETAI_CURSOR_FAST}
      FLEETAI_CURSOR_MODEL: ${FLEETAI_CURSOR_MODEL}
      FLEETAI_CURSOR_REASONING: ${FLEETAI_CURSOR_REASONING}
      FLEETAI_OLLAMA_CONTEXT_WINDOW: ${FLEETAI_OLLAMA_CONTEXT_WINDOW}
      FLEETAI_OLLAMA_MAX_TOKENS: ${FLEETAI_OLLAMA_MAX_TOKENS}
      FLEETAI_OLLAMA_TIMEOUT: ${FLEETAI_OLLAMA_TIMEOUT}
      FLEETAI_SUMMARY_LIMIT: ${FLEETAI_SUMMARY_LIMIT}
      FLEETAI_SUMMARY_MODEL: ${FLEETAI_SUMMARY_MODEL}
      OLLAMA_HOST: http://host.docker.internal:11434
    volumes:
      - ${FLEETAI_PRODUCT_ROOT:?set FLEETAI_PRODUCT_ROOT}:/product
      - projects:/projects
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: fleetai-frontend:0.1.0
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  projects:
