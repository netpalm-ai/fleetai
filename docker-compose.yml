services:
  fleetai:
    build: .
    image: fleetai:0.1.0
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FLEETAI_PRODUCT_ROOT: /product
      AWS_REGION: ${AWS_REGION}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      FLEETAI_BEDROCK_CONNECT_TIMEOUT: ${FLEETAI_BEDROCK_CONNECT_TIMEOUT}
      FLEETAI_BEDROCK_MAX_TOKENS: ${FLEETAI_BEDROCK_MAX_TOKENS}
      FLEETAI_BEDROCK_TIMEOUT: ${FLEETAI_BEDROCK_TIMEOUT}
      FLEETAI_CURSOR_FAST: ${FLEETAI_CURSOR_FAST}
      FLEETAI_CURSOR_MODEL: ${FLEETAI_CURSOR_MODEL}
      FLEETAI_CURSOR_REASONING: ${FLEETAI_CURSOR_REASONING}
      FLEETAI_OLLAMA_CONTEXT_WINDOW: ${FLEETAI_OLLAMA_CONTEXT_WINDOW}
      FLEETAI_OLLAMA_MAX_TOKENS: ${FLEETAI_OLLAMA_MAX_TOKENS}
      FLEETAI_OLLAMA_TIMEOUT: ${FLEETAI_OLLAMA_TIMEOUT}
      FLEETAI_SUMMARY_LIMIT: ${FLEETAI_SUMMARY_LIMIT}
      FLEETAI_SUMMARY_MODEL: ${FLEETAI_SUMMARY_MODEL}
      OLLAMA_HOST: ${OLLAMA_HOST}
    volumes:
      - ${FLEETAI_TICKETS_DIR:-./tickets}:/app/tickets
      - ${FLEETAI_PRODUCT_ROOT:?set FLEETAI_PRODUCT_ROOT}:/product
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
